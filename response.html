<!DOCTYPE html>
<html lang = "en-US">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Body&Data">
    <title>AI Cost Calculator</title>
    <link rel="icon" href="calculator.png">
    <link href="style.css" rel = "stylesheet">
</head>
<body>

<section id="Chat-Page">
    <div id = "input-chat">
        <textarea id="user-prompt-out" class="prompt-output"name="message" rows="5" cols="30" placeholder="User Prompt"></textarea>
    </div>
    <div id = "output-chat">
        <textarea id="response" class="prompt-output" name="message" rows="5" cols="30" readonly placeholder="Response"></textarea>
    </div>
</section>
<section id="Tokenization">
        <h2 id="header">Your Words Tokenized</h2>
        
       
        <article class="token-card">
            <h3>Input Prompt Tokens</h3>
            <div id="input-tokens-visual" class="token-display-box">
            
                <span class="token-pill">Tokens</span> <span class="token-pill">will</span> <span class="token-pill">appear</span> <span class="token-pill">here</span>
            </div>
            <p class="tcount">Input Count: <span id="input-token-count">0</span></p>
        </article>

        <!-- Output Tokens Box -->
        <article class="token-card">
            <h3>Output Response Tokens</h3>
            <div id="output-tokens-visual" class="token-display-box">
                <!-- JavaScript will inject colored span pills here -->
            </div>
            <p class="tcount">Output Count: <span id="output-token-count">0</span></p>
        </article>
    </section>
</body>
</html>
