<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Body&amp;Data">
  <meta name="description" content="AI DEX: ask an AI anything, then see what it really cost in electricity, heat, water, carbon and money.">
  <title data-i18n-title="title.chat">AI DEX</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alegreya-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#user-prompt" data-i18n="skipToChat">Skip to the question box</a>

  <!-- Language and text size, top right on every page -->
  <header class="topbar">
    <span class="topbar-start"></span>
    <div class="topbar-controls">
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:controls.language">
        <button type="button" data-set-lang="en" lang="en" aria-pressed="true">English</button>
        <button type="button" data-set-lang="ne" lang="ne" aria-pressed="false">नेपाली</button>
      </div>
      <button type="button" class="text-size" data-text-size-toggle aria-pressed="false" aria-label="Larger text" data-i18n-attr="aria-label:controls.textSize"><span aria-hidden="true">A+</span></button>
    </div>
  </header>

  <main id="main">
    <div id="chat-app" class="chat-app" data-state="start">

      <header id="Landing-Page-Prompting" class="start-screen">
        <h1 id="exhibit-title" class="wordmark">AI DEX</h1>
        <p class="lede" data-i18n="lede">Ask anything. Then see what it cost.</p>
      </header>

      <section id="Chat-Page" class="conversation" aria-labelledby="conversation-heading">
        <h2 id="conversation-heading" class="visually-hidden" data-i18n="conversation">Conversation</h2>
        <div id="conversation" class="message-list" role="log" aria-label="Messages" data-i18n-attr="aria-label:messages"></div>
        <a id="see-cost" class="see-cost" href="cost.html" hidden data-i18n="seeCost">See what this cost →</a>
        <!-- Announces finished answers to screen readers (not every word). -->
        <p id="answer-announcer" class="visually-hidden" aria-live="polite"></p>
      </section>

      <div class="composer-dock">
        <p id="chat-notice" class="chat-notice" role="status" hidden></p>

        <form id="prompt-box" class="composer" novalidate>
          <label for="user-prompt" class="visually-hidden" data-i18n="yourQuestion">Your question</label>
          <textarea id="user-prompt" class="prompt-input" name="message" rows="1"
            maxlength="2000" placeholder="Ask anything" autocomplete="off"
            data-i18n-attr="placeholder:placeholder"
            aria-describedby="char-count"></textarea>
          <p id="char-count" class="char-count" aria-live="polite"></p>
          <button type="button" id="stop-btn" class="icon-button stop-button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
            <span class="visually-hidden" data-i18n="stop">Stop</span>
          </button>
          <button type="submit" id="submit-prompt" class="icon-button send-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
            <span class="visually-hidden" data-i18n="send">Send</span>
          </button>
        </form>

        <details id="templates" class="templates">
          <summary data-i18n="templates">Template prompts</summary>
          <ul id="presets" class="template-list" aria-label="Template prompts" data-i18n-attr="aria-label:templates"></ul>
        </details>

        <p class="model-line">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="model-status"></span>
          <span aria-hidden="true">·</span>
          <span id="model-name"></span>
          <span aria-hidden="true">·</span>
          <span id="questions-left"></span>
        </p>
      </div>
    </div>
  </main>

  <!-- Kiosk: idle reset -->
  <div id="idle-overlay" class="idle-overlay" hidden>
    <div class="idle-dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-title" aria-describedby="idle-desc">
      <h2 id="idle-title" data-i18n="stillThere">Still there?</h2>
      <p id="idle-desc"></p>
      <button type="button" id="idle-continue" class="button-primary" data-i18n="stillHere">I’m still here</button>
    </div>
  </div>
</body>
</html>
